name: Unzip and Build Vulpio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Move Project Files to Root
        run: |
          echo "Unzipping file..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d temp_extract
            
            # Find the directory containing pubspec.yaml
            TARGET_DIR=$(find temp_extract -name "pubspec.yaml" -exec dirname {} \;)
            
            if [ -n "$TARGET_DIR" ]; then
              echo "Moving files from $TARGET_DIR to current directory..."
              shopt -s dotglob
              cp -r $TARGET_DIR/* .
              rm -rf temp_extract
            else
              echo "Could not find pubspec.yaml inside zip!"
              exit 1
            fi
          else
            echo "No zip file found, proceeding with repository files."
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulpio-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
