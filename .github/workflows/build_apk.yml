name: Unzip and Build Vulpio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          echo "Looking for zip files..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            PUBSPEC_DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \;)
            if [ -n "$PUBSPEC_DIR" ]; then
              echo "Found pubspec.yaml in: $PUBSPEC_DIR"
              cp -rn $PUBSPEC_DIR/* . || true
              cp -rn $PUBSPEC_DIR/.* . 2>/dev/null || true
            fi
          else
            echo "No zip file found, assuming repository is already unzipped."
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulpio-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
